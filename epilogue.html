<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Epilogue">
  <title>Epilogue</title>
  <style>
    :root{color-scheme:dark;--santander-red:#ec0000}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{display:grid;place-items:center;overflow:hidden;background:var(--santander-red)}
    .opening-slide{width:100%;min-height:100%;display:grid;place-items:center;padding:clamp(2rem,8vw,10rem)}
    .brand-mark{display:block;width:min(72vw,1100px);height:auto;filter:brightness(0) invert(1)}
    @media (max-width:600px){.brand-mark{width:min(86vw,1100px)}}
  </style>
</head>
<body>
  <main class="opening-slide" aria-label="Epilogue opening slide">
    <img class="brand-mark" src="assets/santander-logo-long.png" alt="Santander">
  </main>
</body>
</html>
